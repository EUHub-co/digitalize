name: CI/CD Pipeline WEB

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: euhub-marketing
  REGION: europe-west1
  SERVICE_NAME: euhub-ai-web
  ARTIFACT_REGISTRY: europe-west1-docker.pkg.dev/euhub-marketing/euhub-ai-web
  IMAGE_NAME: euhub-ai-web
  RUNTIME_SERVICE_ACCOUNT: "euhub-ai-web-runtime@euhub-marketing.iam.gserviceaccount.com"

jobs:
  ci:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/139826268276/locations/global/workloadIdentityPools/github/providers/euhub-ai-web
          service_account: euhub-ai-web-deployer@euhub-marketing.iam.gserviceaccount.com
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          provenance: false

  cd:
    name: Deploy to Cloud Run
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/139826268276/locations/global/workloadIdentityPools/github/providers/euhub-ai-web
          service_account: euhub-ai-web-deployer@euhub-marketing.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify required config
        run: |
          test -n "${{ env.RUNTIME_SERVICE_ACCOUNT }}" || (echo "Missing variable: RUNTIME_SERVICE_ACCOUNT" && exit 1)

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}"
          DIGEST="${{ needs.ci.outputs.image_digest }}"

          # Check if service exists
          if gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(name)" 2>/dev/null; then

            # Service exists - update image and ensure correct configuration
            echo "Service exists, updating image and configuration..."
            gcloud run deploy ${{ env.SERVICE_NAME }} \
              --image="${IMAGE}@${DIGEST}" \
              --region=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} \
              --platform=managed \
              --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }} \
              --set-env-vars="NEXT_PUBLIC_UMAMI_SCRIPT_URL=${{ vars.NEXT_PUBLIC_UMAMI_SCRIPT_URL }},NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}" \
              --memory=1Gi \
              --cpu=1 \
              --timeout=3600 \
              --max-instances=10 \
              --quiet
          else
            # Service doesn't exist - create with full configuration
            echo "Service doesn't exist, creating with full configuration..."
            gcloud run deploy ${{ env.SERVICE_NAME }} \
              --image="${IMAGE}@${DIGEST}" \
              --region=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} \
              --platform=managed \
              --allow-unauthenticated \
              --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }} \
              --set-env-vars="NEXT_PUBLIC_UMAMI_SCRIPT_URL=${{ vars.NEXT_PUBLIC_UMAMI_SCRIPT_URL }},NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}" \
              --port=3000 \
              --memory=1Gi \
              --cpu=1 \
              --timeout=3600 \
              --min-instances=0 \
              --max-instances=10 \
              --quiet
          fi

          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --to-latest \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --quiet

      - name: Ping IndexNow
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "INDEXNOW_KEY secret not set — skipping IndexNow ping."
            exit 0
          fi
          node scripts/indexnow-submit.mjs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
