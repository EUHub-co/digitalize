# Drop-in for EUHub-co/digitalize (site: euhub-ai.com) -> .github/workflows/azure-deploy.yml
#
# Azure is the primary deploy target: every push to main ships to Container Apps.
# The existing deploy.yml (GCP Cloud Run, "CI/CD Pipeline WEB") stays as a
# manual (workflow_dispatch) fallback during the soak window. Note its
# `dev`/`staging` sibling workflows are NOT ported — this migration is
# prod-only (their target branches don't exist on the remote today).
#
# HONEST MIRROR NOTE: this repo has no CI test gate today — its GCP
# deploy.yml is build -> push -> deploy with no lint/typecheck/test job. This
# workflow does the same: the Docker build IS the gate. Do not add steps
# that have never gated this repo.
#
# Repo prerequisites (GitHub -> Settings -> Environments -> "prod"):
#   Environment VARIABLES (not secrets):
#     AZURE_CLIENT_ID              = <deploy_client_ids["euhub-ai-web"] from the apps stack>
#     AZURE_TENANT_ID              = 8c4f47c0-d3cc-4c9c-bc45-39bbf0eb18be
#     AZURE_SUBSCRIPTION_ID        = 42d3345a-2568-48e0-a414-3fc00ee2cba7
#     NEXT_PUBLIC_UMAMI_SCRIPT_URL = <value — read via process.env in a server component at
#                                      request time, not inlined, so this is a Container App
#                                      runtime env var (see apps map), not a build arg>
#     NEXT_PUBLIC_UMAMI_WEBSITE_ID = <value — same>
#   Environment SECRET (optional):
#     INDEXNOW_KEY — deploy-time ping only; step is skip-if-unset.
#
# NEXT_PUBLIC_GTM_ID is already wired as a Container App runtime env_var via
# Terraform (apps map) — GTM-KMHTFB3N, matching the live GCP service.
#
# Auth is keyless: GitHub OIDC -> user-assigned managed identity (federated
# credential subject repo:EUHub-co/digitalize:environment:prod — the deploy
# job's `environment: prod` below is what makes the OIDC subject match).

name: Deploy → Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC token for azure/login
  contents: read

concurrency:
  group: deploy-azure-web
  cancel-in-progress: false

env:
  ACR_NAME: acreuhubprod
  ACR_SERVER: acreuhubprod.azurecr.io
  IMAGE_NAME: euhub-ai-web
  APP_NAME: ca-euhub-ai-web
  RESOURCE_GROUP: rg-euhub-prod-apps

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod # scopes the AZURE_* vars AND shapes the OIDC subject
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install site dependencies
        run: npm ci

      - name: Azure login (OIDC, keyless)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr login --name "$ACR_NAME"
          docker build -t "$ACR_SERVER/$IMAGE_NAME:${{ github.sha }}" .
          docker push "$ACR_SERVER/$IMAGE_NAME:${{ github.sha }}"

      - name: Roll out new revision
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_SERVER/$IMAGE_NAME:${{ github.sha }}"

      - name: Health check
        run: |
          FQDN=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
                   --query properties.configuration.ingress.fqdn -o tsv)
          echo "Checking https://$FQDN/en (apex / 301s to /en — no dedicated health endpoint)"
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://$FQDN/en" > /dev/null; then
              echo "healthy"; exit 0
            fi
            echo "attempt $i failed; retrying in 10s"; sleep 10
          done
          echo "::error::new revision never became healthy"; exit 1

      - name: SEO production smoke test
        run: node scripts/retry-command.mjs --attempts 12 --delay-ms 10000 -- npm run seo:smoke -- --base-url https://ai.euhub.co

      - name: Ping IndexNow
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "INDEXNOW_KEY secret not set — skipping IndexNow ping."
            exit 0
          fi
          node scripts/indexnow-submit.mjs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
